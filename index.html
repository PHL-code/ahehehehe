    <body>
        <h1>hãy ăn cứt của đạt để có cách giải bài tập</h1>
        #include <bits/stdc++.h>
        using namespace std;
        using ll=long long;
        ll f[1000006];
        const ll mod=1e9+7;
        int main()
        {
            ll n;   
            cin>>n;
            f[1]=1;
            f[2]=1;
            for (int i=2; i<=n; i++)
                f[i]=(f[i-2]+f[i-1])%mod;  
            cout<<f[n]<<"\n";
        }
    </body>
</html>
